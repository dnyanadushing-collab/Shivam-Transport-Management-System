{% extends "base.html" %}

{% block title %}Edit Customer{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-warning">

                <h3 class="mb-0">✏️ Edit Customer</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">Customer Name</label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ customer.name }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Mobile Number</label>

                        <input
                            type="text"
                            name="mobile"
                            class="form-control"
                            value="{{ customer.mobile }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Village</label>

                        <input
                            type="text"
                            name="village"
                            class="form-control"
                            value="{{ customer.village }}">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Address</label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="4">{{ customer.address }}</textarea>

                    </div>

                    <button type="submit" class="btn btn-success">
                        💾 Update Customer
                    </button>

                    <a href="/customers" class="btn btn-secondary">
                        ↩ Back
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
