{% extends "base.html" %}

{% block title %}Edit Udhari{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow">

            <div class="card-header bg-warning">

                <h3 class="mb-0">✏️ Edit Udhari</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">Customer</label>

                        <select name="customer" class="form-select" required>

                            {% for customer in customers %}

                            <option value="{{ customer.id }}"
                                {% if udhari.customer_id == customer.id %}selected{% endif %}>
                                {{ customer.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Amount (₹)</label>

                        <input
                            type="number"
                            name="amount"
                            class="form-control"
                            value="{{ udhari.amount }}"
                            step="0.01"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Description</label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="3">{{ udhari.description }}</textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Udhari Date</label>

                        <input
                            type="date"
                            name="udhari_date"
                            class="form-control"
                            value="{{ udhari.udhari_date }}"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success">

                        💾 Update Udhari

                    </button>

                    <a href="/udhari"
                       class="btn btn-secondary">

                        ↩ Back

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
