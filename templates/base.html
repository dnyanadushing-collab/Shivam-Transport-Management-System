<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Shivam Transport{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<div class="d-flex">

    <!-- Sidebar -->

    <div class="bg-dark text-white p-3 shadow position-fixed"
     style="width:260px;height:100vh;overflow-y:auto;">

        <h3 class="text-center mb-4">
            🚛 Shivam Transport
        </h3>

        <div class="list-group">

            <a href="/dashboard"
               class="list-group-item list-group-item-action">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a href="/customers"
               class="list-group-item list-group-item-action">
                <i class="bi bi-people-fill"></i>
                Customers
            </a>

            <a href="/trips"
               class="list-group-item list-group-item-action">
                <i class="bi bi-truck"></i>
                Trips
            </a>

            <a href="/udhari"
               class="list-group-item list-group-item-action">
                <i class="bi bi-cash-stack"></i>
                Udhari
            </a>

            <a href="/payments"
               class="list-group-item list-group-item-action">
                <i class="bi bi-wallet2"></i>
                Payments
            </a>

            <a href="/reports"
               class="list-group-item list-group-item-action">
                <i class="bi bi-bar-chart-fill"></i>
                Reports
            </a>

            <a href="/"
               class="list-group-item list-group-item-action text-danger">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

    </div>

    <!-- Main Content -->

    <div class="container-fluid" style="margin-left:260px;">

        <!-- Top Navbar -->

        <nav class="navbar navbar-expand-lg bg-white shadow-sm rounded mt-3">

            <div class="container-fluid py-4 px-4" style="margin-left:260px;">

                <span class="navbar-brand fw-bold">
                    🚛 Shivam Transport Management System
                </span>

                <span class="text-muted">
                    <i class="bi bi-person-circle"></i>
                    Admin
                </span>

            </div>

        </nav>

        <div class="p-4">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>
</html>
